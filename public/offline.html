<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidak ada sinyal · Semai</title>
    <style>
      :root { --canvas: #fdfcfc; --taupe: #f5f3f1; --ink: #000; --smoke: #777169; }
      @media (prefers-color-scheme: dark) {
        :root { --canvas: #0f0e0d; --taupe: #1b1a18; --ink: #f7f5f2; --smoke: #a8a29a; }
      }
      body { margin: 0; min-height: 100dvh; background: var(--canvas); color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 28rem; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px; }
      .logo { font-size: 24px; font-weight: 300; letter-spacing: -0.02em; }
      .card { background: var(--taupe); border-radius: 20px; padding: 20px; }
      h1 { font-size: 20px; font-weight: 300; letter-spacing: -0.02em; margin: 0 0 4px; }
      p { margin: 0; color: var(--smoke); font-size: 14px; line-height: 1.5; }
      button { margin-top: 16px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0;
        background: #beff50; color: #0b0b0a; font: inherit; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <span class="logo">semai</span>
      <div class="card">
        <h1>Tidak ada sinyal</h1>
        <p>Halaman absen belum tersimpan di HP ini. Sambungkan internet sekali, lalu buka Semai lagi. Setelah itu kamu bisa absen walau sinyal hilang.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
      </div>
    </main>
  </body>
</html>
